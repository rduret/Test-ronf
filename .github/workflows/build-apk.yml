name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk MicSansEcho.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MicSansEcho-apk
          path: MicSansEcho.apk
      - name: Publier l'APK (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Micro sans écho (dernière version)
          body: Téléchargez MicSansEcho.apk ci-dessous et ouvrez-le sur votre téléphone Android.
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: MicSansEcho.apk
